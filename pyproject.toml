[project]
name = "comfyui-wan-i2v-control"
description = "A user-friendly way to selectively transform parts of your starting image in WAN Image-to-Video generation. Uses masking and person detection to control which regions of the initial frame get transformed — change a character's face while keeping the background intact."
version = "1.0.0"
license = "MIT"
authors = [
    { name = "Peter Neill" }
]
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/shootthesound/comfyui-wan-i2v-control"
Repository = "https://github.com/shootthesound/comfyui-wan-i2v-control"
Issues = "https://github.com/shootthesound/comfyui-wan-i2v-control/issues"

[tool.comfy]
PublisherId = "shootthesound"
DisplayName = "WAN I2V Control"
Icon = ""
